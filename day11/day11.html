<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
/* 

grid
grid is two dimensional layout model used to create complex layouts

grid-container
1) display:grid
it will the grid container

2) 
grid-template-columns
it specifies the no of columsn and size of each column
    grid-template-columns: 100px 150px 200px 250px;
    grid-template-columns:25% 25% 50%;
    grid-template-columns:1fr 1fr 1fr 1fr;
    grid-template-columns:1fr 2fr 1fr;
3) 
gap
it is used to create space

4) grid-template-rows
it specifies the size of each row
grid-items

5) justify-content
6) align-content
*/

.parent{
    display:grid;
    grid-template-columns: 100px 150px 200px 250px;
    grid-template-columns:25% 25% 50%;
    grid-template-columns:1fr 1fr 1fr 1fr;
    grid-template-columns:1fr 2fr 1fr;
    gap:10px 20px;
    grid-template-rows:100px 150px 200px 250px;

}
.child{
    background:lightsalmon;
    padding:20px;
    border:1px solid black;
}
/* .container>.box$*10{box$} */
.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
grid-template-rows:200px 150px 200px;
}
.container>div{
    background:lightseagreen;
    padding:20px;
    border:1px solid black;
}
.box1{
    grid-column:1/2;
    grid-row:1/4;
}
.box2{
    grid-column:2/4;
    grid-row:1/2;
}
.box8{
    grid-column: 4/5;
    grid-row:2/4;
}
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child1</div>
        <div class="child">child2</div>
        <div class="child">child3</div>
        <div class="child">child4</div>
        <div class="child">child5</div>
        <div class="child">child6</div>
        <div class="child">child7</div>
        <div class="child">child8</div>
        <div class="child">child9</div>
        <div class="child">child10</div>
    </div>

    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
        <div class="box5">box5</div>
        <div class="box6">box6</div>
        <div class="box7">box7</div>
        <div class="box8">box8</div>
    </div>
    
</body>
</html>
