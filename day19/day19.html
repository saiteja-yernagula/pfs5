let prom=new Promise((res,rej)=>{
    let val=10
    if(val==10){
        res('promise is resolved')
    }else{
        rej('promise is rejected')
    }
})
//consuming a promise using .then.catcch
prom.then((fullfilled)=>console.log(fullfilled))
.catch((error)=>console.log(error))

//using async and await
async function getprom(){
    //it pauses the execution untill the promise is settled
    let data=await prom
    console.log(data)
}
getprom()

 async function getdata(){
