    <style>
     header{
        background:lightseagreen;
        color:white;
        padding:3%;
        text-align:center;
        position:sticky;
        top:0;
     }
     header>a{
        color:white;
        border:2px solid white;
        padding:10px;
        margin:10px;
        border-radius:10px;
     }

     section{
        padding:3%;
     }
     .card{
        width:25%;
        display:inline-block;
        padding:3%;
        border: 2px solid lightseagreen;
        border-radius:10px;
     }
     .card img{
        width:200px;
        height:200px;
     }
     /* 
     
     
     positions
     static -by default
     sticky- it will fixed the element when the condition is met
          position:sticky;
          top:30px;
     
     */
     i{
        font-size:3rem;
        color:lightseagreen
     }
     .icons{
        position:fixed;
        top:200px;
        right:10px;
     }
 

     #el{
        position:relative;
        z-index:-10;
     }
     .card i{
     position:absolute;
       left:0;
       top:200px;
     }

     header{
        animation-name:backgroundchange;
        animation-duration:2s;
        animation-iteration-count: infinite;
     }

     @keyframes backgroundchange{
        from{
            background:darkblue;
        }
        to{
            background:orange;
        }
     }
    </style>
</head>
<body>
    <div class="icons">
